[project]
name = "roadbed-workspace"
version = "0.0.0"
description = "Roadbed workspace root (prototype)."
requires-python = ">=3.12"
dependencies = ["roadbed"]

[tool.uv]
package = false

[tool.uv.sources]
roadbed = { workspace = true }

[tool.uv.workspace]
members = ["packages/roadbed"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["packages/roadbed/tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running statistical checks (run with -m slow)"]
