name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: uv run --locked ruff check .
      - name: Type check (mypy, packages/roadbed/src)
        run: uv run --locked mypy
      - name: Tests (includes the schema drift and fixture drift tests)
        run: uv run --locked pytest -q
      - name: Schema drift (regenerate, then require no diff)
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python -c "from roadbed.contracts import export_schemas; export_schemas('spec/schemas/v0.1')"
          git diff --exit-code -- spec/schemas
      - name: Fixture and conformance drift (rebuild, then require no diff)
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python spec/tools/build_examples.py
          uv run --locked python spec/tools/build_conformance.py
          git diff --exit-code -- spec/examples/pass spec/examples/blocked spec/conformance
          for a in pass blocked; do
            test "$(git bundle list-heads spec/examples/$a.bundle)" = "$(git show HEAD:spec/examples/$a.bundle > /tmp/$a.bundle && git bundle list-heads /tmp/$a.bundle)"
          done

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Regenerate docs/cli.md, then require no diff
        run: |
          uv run --locked typer roadbed.cli.main utils docs --name roadbed --output docs/cli.md
          git diff --exit-code -- docs/cli.md

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Build both packages
        run: |
          uv build --package roadbed
          uv build --package roadbed-sdk
      - name: Check the package metadata
        run: uvx twine check dist/*

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --no-banner --redact
