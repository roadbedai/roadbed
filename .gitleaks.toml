# Every finding in the first scan was a synthetic value: HMAC-style tokens in fixtures, test tokens, and one false match in signing.py.
# The allowlist names those values, never a path, so the tests and the spec are scanned too.
title = "roadbed gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "synthetic fixture values"
regexTarget = "secret"
regexes = [
    '''^tok_[0-9a-f]{8}$''',
    '''^tok_[0-9a-f]{32}$''',
    '''^rbt_test_0123456789abcdef$''',
    '''^AKIA/secret\+key=$''',
    '''^Ed25519PrivateKey$''',
]
