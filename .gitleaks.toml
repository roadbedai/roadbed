# Every finding in the first scan was a synthetic value: HMAC-style tokens in fixtures, test tokens, and one false match in signing.py.
title = "roadbed gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic fixtures, test data and generated examples"
paths = [
    '''^spec/conformance/''',
    '''^spec/examples/''',
    '''^spec/tools/build_(examples|conformance)\.py$''',
    '''^packages/[^/]+/tests/''',
    '''^packages/roadbed/src/roadbed/asset/signing\.py$''',
]
