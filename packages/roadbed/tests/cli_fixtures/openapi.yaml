          - type: 'null'
          default: null
          description: Optional. Merkle root of the holdout row hashes.
          title: Merkle Root
        minhash_oid:
          anyOf:
          - description: 'Bucket object id: lowercase hex sha256 of the object bytes.'
            pattern: ^[0-9a-f]{64}$
            type: string
          - type: 'null'
          default: null
          description: Optional. Bucket object with the holdout MinHash signatures.
