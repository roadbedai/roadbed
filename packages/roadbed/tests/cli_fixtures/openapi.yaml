          minLength: 1
          title: Verdict Id
          type: string
        interaction_id:
          minLength: 1
          title: Interaction Id
          type: string
        action:
          enum:
          - approve
          - fix
          - reject
          - escalate
          title: Action
          type: string
        verdict:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          description: Required when action is fix.
          title: Verdict
        reason_code:
          anyOf:
          - pattern: ^[a-z_]{1,64}$
            type: string
          - type: 'null'
          default: null
