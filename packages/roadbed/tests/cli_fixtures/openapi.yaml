        concurrency:
          minimum: 1
          title: Concurrency
          type: integer
        p50_ms:
          minimum: 0
          title: P50 Ms
          type: number
        p95_ms:
          minimum: 0
          title: P95 Ms
          type: number
        tokens_per_s:
          minimum: 0
          title: Tokens Per S
          type: number
        eur_per_1k_calls:
          minimum: 0
          title: Eur Per 1K Calls
