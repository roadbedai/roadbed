          - action
        then:
          properties:
            verdict:
              type: object
            reason_code:
              type: string
          required:
          - verdict
          - reason_code
      description: 'A stored verdict: the VerdictIn body plus the server-set actor. Never a request body.'
      properties:
        verdict_id:
          description: Client-made id. Retries with the same id are no-ops.
