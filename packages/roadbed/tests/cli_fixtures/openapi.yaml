          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        synthetic:
          title: Synthetic
          type: boolean
        seal_commit:
          anyOf:
          - description: 40-hex commit sha.
            pattern: ^[0-9a-f]{40}$
            type: string
          - type: 'null'
          default: null
